# =====================================================================
# devcontainer.yml : vérifie qu'un étudiant peut travailler dans le
# Codespace, pour les deux configurations du dépôt.
#
#   - distribuée (.devcontainer/devcontainer.json) : télécharge l'image
#     publiée sur ghcr.io, SANS authentification, exactement comme le
#     codespace d'un étudiant. Échoue si le paquet a été supprimé, est
#     repassé en privé, ou si l'image ne correspond plus à requirements.txt.
#   - source (.devcontainer/source/) : construit réellement l'image avec ses
#     features. Échoue si une image de base, une feature ou une dépendance a
#     bougé : c'est la configuration de secours, et celle de la prochaine
#     publication.
#
# Dans les deux cas, le smoke-test .devcontainer/smoke-test.sh tourne dans
# le conteneur : exécution du notebook de bout en bout, `make lint` et
# `make format-check`.
#
# Pourquoi : une casse n'est sinon visible qu'à la création d'un Codespace,
# c'est-à-dire en début de séance, devant toute la promotion.
#
# Déclencheurs :
#   - schedule hebdomadaire : attrape la DÉRIVE EXTERNE (base, feature ou
#     dépendance qui bouge, paquet qui disparaît SANS changement de config) :
#     c'est le mode de panne réel. Ne tourne que sur la branche par défaut.
#   - push/PR touchant .devcontainer/** ou requirements.txt, que le
#     Dockerfile copie dans l'image : attrape les régressions de config.
#   - push/PR touchant ce que le smoke-test exécute (notebook, Makefile,
#     configuration de ruff) : attrape une cellule cassée ou mal formatée
#     avant qu'elle n'arrive chez les étudiants.
#   - manuel (workflow_dispatch) : à lancer la veille d'une séance.
#
# Les étudiants créent leur dépôt avec « Use this template » : tout le
# dossier .github/ est copié chez eux. Le job est donc neutralisé partout
# ailleurs que dans le dépôt enseignant, pour ne pas lancer un build par
# semaine dans chaque copie.
# =====================================================================
name: devcontainer

on:
  push:
    paths:
      - ".devcontainer/**"
      - "requirements.txt"
      - "notebook_seance.ipynb"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/devcontainer.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - "requirements.txt"
      - "notebook_seance.ipynb"
      - "Makefile"
      - "pyproject.toml"
      - ".github/workflows/devcontainer.yml"
  schedule:
    - cron: "0 6 * * 1" # lundi 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: smoke-test (${{ matrix.nom }})
    # Ne pas tourner dans les copies étudiantes.
    if: github.repository == 'IUTInfoAix/IntroPython'
    runs-on: ubuntu-latest
    strategy:
      # Les deux configurations tombent en panne pour des raisons
      # différentes : l'échec de l'une ne doit pas masquer l'état de l'autre.
      fail-fast: false
      matrix:
        include:
          - nom: image distribuée
            config: .devcontainer/devcontainer.json
          - nom: construction depuis source
            config: .devcontainer/source/devcontainer.json
    steps:
      - uses: actions/checkout@v7
      # Pas de `docker login` avant cette étape : l'image distribuée doit
      # rester téléchargeable sans authentification, comme chez un étudiant.
      - name: Build & smoke-test devcontainer
        uses: devcontainers/ci@v0.3
        with:
          configFile: ${{ matrix.config }}
          runCmd: .devcontainer/smoke-test.sh
          push: never
