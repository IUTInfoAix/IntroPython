# Configuration pre-commit pour Python pour Informaticiens
# Installation : make pre-commit-install
# Exécution manuelle : make pre-commit-run

repos:
  # Hooks généraux
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Supprime les espaces en fin de ligne
      - id: end-of-file-fixer
        name: Vérifie la fin de fichier
      - id: check-yaml
        name: Vérifie les fichiers YAML
      - id: check-json
        name: Vérifie les fichiers JSON
      - id: check-toml
        name: Vérifie les fichiers TOML
      - id: check-added-large-files
        name: Vérifie les fichiers trop volumineux
        args: ['--maxkb=500']
      - id: check-merge-conflict
        name: Vérifie les conflits de merge
      - id: mixed-line-ending
        name: Vérifie les fins de ligne
        args: ['--fix=lf']

  # Ruff - Formatage, tri des imports et lint (fichiers .py et notebooks)
  # rev : même version que ruff dans requirements.txt
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      # Seule correction automatique : le tri des imports, comme `make format`.
      # Les autres règles sont signalées sans --fix, à l'étudiant de corriger.
      - id: ruff-check
        alias: ruff-imports
        name: Trie les imports avec ruff
        args: [--select, I, --fix]
      - id: ruff-format
        name: Formate le code avec ruff
      - id: ruff-check
        name: Vérifie le code avec ruff

# Configuration globale
default_language_version:
  python: python3

# Exécution plus rapide (nouveau format)
default_stages: [pre-commit]

# Ignorer certains fichiers
exclude: |
  (?x)^(
      \.git/|
      \.venv/|
      venv/|
      __pycache__/|
      \.ruff_cache/|
      \.pytest_cache/|
      \.tox/|
      build/|
      dist/|
      .*\.egg-info/|
      .*\.ipynb_checkpoints/
  )
